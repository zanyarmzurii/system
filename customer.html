<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاشا کڕیاری - کاشێرپڕۆ ERP</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); display: flex; height: 100vh; margin: 0; overflow: hidden; }
        .customer-container { display: grid; grid-template-columns: 1fr 400px; width: 100%; height: 100%; }
        .customer-main { padding: 40px; display: flex; flex-direction: column; justify-content: space-between; }
        .customer-welcome { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: #94a3b8; text-align: center; }
        .customer-welcome i { font-size: 80px; color: #38bdf8; margin-bottom: 20px; }
        .customer-cart-list { flex-grow: 1; overflow-y: auto; margin-top: 20px; display: flex; flex-direction: column; gap: 12px; }
        .customer-cart-item { background-color: rgba(30, 41, 59, 0.8); border: 1px solid #334155; padding: 18px; border-radius: 14px; display: flex; justify-content: space-between; align-items: center; }
        .customer-side-banner { background-color: #0b1120; border-right: 1px solid #334155; padding: 30px; display: flex; flex-direction: column; justify-content: space-between; }
        .total-display-card { background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: #000; padding: 30px; border-radius: 20px; text-align: center; }
    </style>
</head>
<body>
    <div class="customer-container">
        <div class="customer-main">
            <h1 style="color: #38bdf8;"><i class="fa-solid fa-store"></i> کاشێرپڕۆ ERP</h1>
            <div id="welcomeScreen" class="customer-welcome">
                <i class="fa-solid fa-basket-shopping"></i>
                <h2>بەخێربێن بۆ مارکێتێ مە!</h2>
                <p>زانیاریی کڕینەکانتان ڕاستەوخۆ لێرە دیار دەبێت.</p>
            </div>
            <div id="customerCartList" class="customer-cart-list" style="display: none;"></div>
        </div>
        <div class="customer-side-banner">
            <div>
                <h2 style="color: #38bdf8;">بەخێر بێن 🌹</h2>
            </div>
            <div class="total-display-card">
                <h3>کۆی گشتیی پارە:</h3>
                <h1 id="customerGrandTotal" style="font-size: 36px; font-weight: 900;">0 د.ع</h1>
            </div>
        </div>
    </div>
    <script>
        const posChannel = new BroadcastChannel('pos_channel');
        posChannel.onmessage = function (event) {
            const data = event.data;
            if (data.type === 'UPDATE_CART') {
                updateCustomerDisplay(data.cart, data.total);
            } else if (data.type === 'CLEAR_CART') {
                resetCustomerDisplay();
            }
        };

        function updateCustomerDisplay(cart, total) {
            const welcomeScreen = document.getElementById('welcomeScreen');
            const cartList = document.getElementById('customerCartList');
            const totalDisplay = document.getElementById('customerGrandTotal');

            if (!cart || cart.length === 0) { resetCustomerDisplay(); return; }

            welcomeScreen.style.display = 'none';
            cartList.style.display = 'flex';
            cartList.innerHTML = '';

            cart.forEach(item => {
                const div = document.createElement('div');
                div.className = 'customer-cart-item';
                div.innerHTML = `
                    <div>
                        <div style="font-size: 18px; font-weight: bold;">${item.name}</div>
                        <div style="color: #94a3b8; font-size: 13px;">${item.price.toLocaleString()} د.ع x ${item.qty}</div>
                    </div>
                    <div style="font-size: 20px; color: #10b981; font-weight: bold;">${(item.price * item.qty).toLocaleString()} د.ع</div>
                `;
                cartList.appendChild(div);
            });
            totalDisplay.innerText = `${total.toLocaleString()} د.ع`;
        }

        function resetCustomerDisplay() {
            document.getElementById('welcomeScreen').style.display = 'flex';
            document.getElementById('customerCartList').style.display = 'none';
            document.getElementById('customerGrandTotal').innerText = '0 د.ع';
        }
    </script>
</body>
</html>
